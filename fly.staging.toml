app = "elite-turf-booking-staging"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/app.db"
  UPLOAD_DIR = "/data/uploads"
  STATIC_DIR = "/app/static"
  SEED_MODE = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[mounts]
  source = "ground_booking_staging_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
