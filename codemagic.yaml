workflows:
  turf-booking-ios:
    name: Turf Booking iOS Build & Upload
    max_build_duration: 110
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      vars:
        XCODE_PROJECT: "sports-booking-frontend/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6795659906
        BUNDLE_ID: "com.elitedev.turfbooking"
      node: 22
      xcode: latest
    cache:
      cache_paths:
        - sports-booking-frontend/node_modules
        - $HOME/.npm
    scripts:
      - name: Install Node dependencies
        script: |
          cd sports-booking-frontend
          npm install
      - name: Build web assets
        script: |
          cd sports-booking-frontend
          if [ -z "${VITE_API_URL:-}" ]; then
            echo "VITE_API_URL=https://ground-booking-eleg.onrender.com" > .env
            echo "Warning: VITE_API_URL not set; using production Render URL."
          fi
          npm run build
      - name: Sync Capacitor iOS project
        script: |
          cd sports-booking-frontend
          npx cap sync ios
      - name: Prepare certificate signing key
        script: |
          set -e
          CERT_KEY_PATH="$CM_BUILD_DIR/cert_key.pem"
          mkdir -p "$(dirname "$CERT_KEY_PATH")"
          rm -f "$CERT_KEY_PATH" "$CERT_KEY_PATH.pub"
          if [ -n "${FCI_CERTIFICATE_PRIVATE_KEY:-}" ]; then
            printf '%s' "$FCI_CERTIFICATE_PRIVATE_KEY" | openssl base64 -d -out "$CERT_KEY_PATH" 2>/dev/null || true
            if openssl rsa -in "$CERT_KEY_PATH" -check -noout >/dev/null 2>&1; then
              echo "Using provided certificate private key"
            else
              echo "FCI_CERTIFICATE_PRIVATE_KEY is not a valid base64 RSA private key; generating a new one"
              rm -f "$CERT_KEY_PATH" "$CERT_KEY_PATH.pub"
              ssh-keygen -t rsa -b 2048 -m PEM -f "$CERT_KEY_PATH" -q -N ""
              rm -f "$CERT_KEY_PATH.pub"
              echo "SAVE THIS PRIVATE KEY AS FCI_CERTIFICATE_PRIVATE_KEY (base64) IN CODEMAGIC:"
              openssl base64 -in "$CERT_KEY_PATH"
            fi
          else
            ssh-keygen -t rsa -b 2048 -m PEM -f "$CERT_KEY_PATH" -q -N ""
            rm -f "$CERT_KEY_PATH.pub"
            echo "SAVE THIS PRIVATE KEY AS FCI_CERTIFICATE_PRIVATE_KEY (base64) IN CODEMAGIC:"
            openssl base64 -in "$CERT_KEY_PATH"
          fi
      - name: Fetch or create signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:"$CM_BUILD_DIR/cert_key.pem"
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set code signing profiles
        script: |
          xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR/sports-booking-frontend/ios/App"
          agvtool new-version -all $(($BUILD_NUMBER + 1))
          agvtool new-marketing-version 1.0.$(($BUILD_NUMBER + 1))
      - name: Build iOS .ipa
        script: |
          cd "$CM_BUILD_DIR/sports-booking-frontend/ios/App"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - sports-booking-frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - eliteaiwin@gmail.com
        notify:
          success: true
          failure: true

  turf-booking-android:
    name: Turf Booking Android Build
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      groups:
        - appstore_credentials
      vars:
        PACKAGE_NAME: "com.elitedev.turfbooking"
      node: 22
    cache:
      cache_paths:
        - sports-booking-frontend/node_modules
        - $HOME/.npm
        - $HOME/.gradle/caches
    scripts:
      - name: Install Node dependencies
        script: |
          cd sports-booking-frontend
          npm install
      - name: Build web assets
        script: |
          cd sports-booking-frontend
          if [ -z "${VITE_API_URL:-}" ]; then
            echo "VITE_API_URL=https://ground-booking-eleg.onrender.com" > .env
            echo "Warning: VITE_API_URL not set; using production Render URL."
          fi
          npm run build
      - name: Sync Capacitor Android project
        script: |
          cd sports-booking-frontend
          npx cap sync android
      - name: Bump Android version code
        script: |
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" sports-booking-frontend/android/app/build.gradle
      - name: Build Android AAB and APK
        script: |
          cd sports-booking-frontend/android
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - sports-booking-frontend/android/app/build/outputs/bundle/release/*.aab
      - sports-booking-frontend/android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - eliteaiwin@gmail.com
        notify:
          success: true
          failure: true
